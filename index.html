
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Data Retrieval and Filtering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>AJAX User Directory</h1>
            <p>Retrieve and filter user data dynamically</p>
        </header>

        <section class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="Search by name or city..."
                aria-label="Search users by name or city"
            >
            <button id="searchBtn">Search</button>
            <button id="resetBtn">Reset</button>
        </section>

        <p id="status">Loading users...</p>

        <section id="userContainer" class="user-grid">
            <!-- User data will appear here -->
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
